kind = "web"
previewPath = "/"
title = "INSTA SHOP"
description = "A simple storefront featuring only two digital products: INSTA HI2 and INSTA GMAIL."
version = "1.0.0"
id = "artifacts/insta-shop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24518

[services.development]
run = "pnpm --filter @workspace/insta-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/insta-shop", "run", "build" ]
serve = "static"
publicDir = "artifacts/insta-shop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24518"
BASE_PATH = "/"
